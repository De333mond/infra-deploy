---
- name: Create K3s configuration directory
  ansible.builtin.file: 
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure K3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart K3s

- name: Check whether K3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Read installed K3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed_version
  changed_when: false
  when: k3s_binary.stat.exists

- name: Install or upgrade K3s
  when: not k3s_binary.stat.exists or k3s_installed_version.stdout_lines[0].split()[2] != k3s_version
  block:
    - name: Download K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Run K3s installer
      ansible.builtin.command: /bin/sh /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"

- name: Ensure K3s is started
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
