---
- name: Prepare ARC credentials and registry CA
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Create ARC runner namespace
      ansible.builtin.command:
        argv: [/usr/local/bin/k3s, kubectl, apply, --field-manager=ansible, -f, "-"]
        stdin: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: arc-runners
      register: arc_namespace_result
      changed_when: "'unchanged' not in arc_namespace_result.stdout"

    - name: Create temporary directory for ARC credentials
      ansible.builtin.tempfile:
        state: directory
        prefix: arc-secrets-
      register: arc_remote_directory

    - name: Install ARC credentials and CA
      block:
        - name: Copy GitHub token
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../local/github-token"
            dest: "{{ arc_remote_directory.path }}/github_token"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Copy registry CA
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../local/registry/ca.crt"
            dest: "{{ arc_remote_directory.path }}/ca.crt"
            owner: root
            group: root
            mode: "0600"
          no_log: true

        - name: Render GitHub authentication Secret
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - kubectl
              - create
              - secret
              - generic
              - arc-github-auth
              - --namespace=arc-runners
              - "--from-file=github_token={{ arc_remote_directory.path }}/github_token"
              - --dry-run=client
              - -o=yaml
          register: arc_auth_manifest
          changed_when: false
          no_log: true

        - name: Apply GitHub authentication Secret
          ansible.builtin.command:
            argv: [/usr/local/bin/k3s, kubectl, apply, --field-manager=ansible, -f, "-"]
            stdin: "{{ arc_auth_manifest.stdout }}"
          register: arc_auth_result
          changed_when: "'unchanged' not in arc_auth_result.stdout"
          no_log: true

        - name: Render registry CA ConfigMap
          ansible.builtin.command:
            argv:
              - /usr/local/bin/k3s
              - kubectl
              - create
              - configmap
              - arc-registry-ca
              - --namespace=arc-runners
              - "--from-file=ca.crt={{ arc_remote_directory.path }}/ca.crt"
              - --dry-run=client
              - -o=yaml
          register: arc_ca_manifest
          changed_when: false

        - name: Apply registry CA ConfigMap
          ansible.builtin.command:
            argv: [/usr/local/bin/k3s, kubectl, apply, --field-manager=ansible, -f, "-"]
            stdin: "{{ arc_ca_manifest.stdout }}"
          register: arc_ca_result
          changed_when: "'unchanged' not in arc_ca_result.stdout"
      always:
        - name: Remove temporary ARC credentials
          ansible.builtin.file:
            path: "{{ arc_remote_directory.path }}"
            state: absent
          no_log: true
