apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  chart:
    spec:
      chart: traefik
      version: 39.0.9
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    api:
      dashboard: false
    service:
      type: ClusterIP
